<section class="project-story" aria-label="Project process" data-story>
  <div class="story-sticky"><div class="story-frames">{% for step in site.data.project_stories[page.story] %}<figure class="story-frame {% if forloop.first %}is-current{% endif %}" data-frame="{{ forloop.index0 }}"><img src="{{ '/assets/img/' | append: step.image | append: '-1280.webp' | relative_url }}" alt="{{ step.alt | escape }}" width="1280" height="960" loading="lazy"><figcaption>{{ step.caption }}</figcaption></figure>{% endfor %}</div></div>
  <div class="story-steps">{% for step in site.data.project_stories[page.story] %}<section class="story-step" data-step="{{ forloop.index0 }}"><div><p class="eyebrow">{{ step.label }}</p><h2>{{ step.title }}</h2><p>{{ step.text }}</p><img class="mobile-story-image" src="{{ '/assets/img/' | append: step.image | append: '-1280.webp' | relative_url }}" alt="{{ step.alt | escape }}" width="1280" height="960" loading="lazy"><p class="mobile-story-caption">{{ step.caption }}</p></div></section>{% endfor %}</div>
</section>
