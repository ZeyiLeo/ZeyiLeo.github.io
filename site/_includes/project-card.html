<article class="project-card {% unless project.image %}project-card-type{% endunless %}" data-categories="{{ project.filters | join: ' ' }}">
  <div class="project-copy"><p class="eyebrow">{{ project.category }}</p><h2><a href="{{ project.url | relative_url }}">{{ project.title }}</a></h2><p class="project-summary">{{ project.description }}</p><p class="project-role">{{ project.perspective }}</p><a class="text-link" href="{{ project.url | relative_url }}" aria-label="Explore {{ project.title | escape }}">Explore the project <span aria-hidden="true">›</span></a></div>
  {% if project.image %}<a class="project-image" href="{{ project.url | relative_url }}" aria-label="View {{ project.title | escape }}"><img src="{{ '/assets/img/' | append: project.image | append: '-1280.webp' | relative_url }}" alt="{{ project.image_alt | escape }}" width="1280" height="960" loading="lazy"></a>{% else %}<div class="project-context"><p>{{ project.connections }}</p></div>{% endif %}
</article>
